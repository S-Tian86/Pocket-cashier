<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main style="max-width:420px;margin:0 auto;padding:32px 16px">
    <div class="card">
      <h1 class="page-title" id="business" style="margin-top:0">Caja</h1>
      <p class="muted" id="hint">Escribe el codigo que te dieron para entrar.</p>
      <form id="form">
        <div class="field">
          <label for="code">Codigo de acceso</label>
          <input id="code" class="amount-big" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:4px">
        </div>
        <button class="btn ok block" id="submit" type="submit">Entrar</button>
      </form>
      <p id="error" class="muted" style="color:var(--danger)" hidden></p>
    </div>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
